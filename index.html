<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🌸 Mon RPG de Vie</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#150d1e;font-family:'VT323',monospace}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#7b2d5e;border-radius:4px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ═══════════════════════════════════════════
THÈME — change les couleurs ici
═══════════════════════════════════════════ */
const T={
bg:”#150d1e”, panel:”#1f1030”, panel2:”#2a1540”,
border:”#4a2060”, glow:”#7a3090”,
text:”#ffe4f0”, muted:”#9b6aaa”,
accent:”#ffaed6”, lav:”#c9a8ff”, peach:”#ffb3a0”,
gold:”#ffd580”, green:”#98f5c0”, red:”#ff8fa0”,
};

const COLORS=[”#ffaed6”,”#ffb3e6”,”#ffd6f0”,”#c9a8ff”,”#fda4af”,”#f9a8d4”,”#b8a2ff”,”#fbcfe8”,”#fecdd3”,”#f5d0fe”,”#99f6e4”,”#86efac”];
const XP_BASE={easy:15,medium:30,hard:50};
const XP_BONUS=20, XP_MAX=100;
const MOTIVS=[“Tu es capable de tout ! 💕”,“Chaque petit pas compte ✨”,“Tu brilles déjà 🌟”,“La régularité bat le talent 🎀”,“Fière de toi avant même de commencer 🌸”,“Ton futur toi te remercie 💖”,“T’es incroyable 🦋”,“Une quête à la fois, princesse ⭐”];

/* ═══ INIT DATA ═══ */
const DSTATS=[
{key:“s1”,label:“Intelligence”,icon:“📚”,color:”#f9a8d4”,subs:[{key:“ss1”,label:“Cours”,icon:“🖊️”},{key:“ss2”,label:“Langues”,icon:“💬”},{key:“ss3”,label:“Culture G.”,icon:“🌍”}]},
{key:“s2”,label:“Cuisine”,icon:“🍳”,color:”#fda4af”,subs:[{key:“ss4”,label:“Plats”,icon:“🍜”},{key:“ss5”,label:“Pâtisserie”,icon:“🍰”}]},
{key:“s3”,label:“Sport”,icon:“💪”,color:”#c9a8ff”,subs:[{key:“ss6”,label:“Cardio”,icon:“🏃”},{key:“ss7”,label:“Yoga”,icon:“🧘”},{key:“ss8”,label:“Muscu”,icon:“🏋️”}]},
{key:“s4”,label:“Social”,icon:“💌”,color:”#fbcfe8”,subs:[{key:“ss9”,label:“Amis”,icon:“👯”},{key:“ss10”,label:“Famille”,icon:“🏠”}]},
{key:“s5”,label:“Créativité”,icon:“🎀”,color:”#f5d0fe”,subs:[{key:“ss11”,label:“Dessin”,icon:“🎨”},{key:“ss12”,label:“Musique”,icon:“🎵”},{key:“ss13”,label:“Écriture”,icon:“✍️”}]},
{key:“s6”,label:“Bien-être”,icon:“🌸”,color:”#fecdd3”,subs:[{key:“ss14”,label:“Méditation”,icon:“🌙”},{key:“ss15”,label:“Soins”,icon:“🛁”},{key:“ss16”,label:“Sommeil”,icon:“😴”}]},
];

function mkXp(xp){return{level:Math.floor(xp/XP_MAX)+1,cur:xp%XP_MAX,max:XP_MAX}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function daysLeft(d){return Math.ceil((new Date(d)-new Date())/(864e5))}

function buildInit(){
const stats={},subs={};
DSTATS.forEach(s=>{stats[s.key]=0;s.subs.forEach(x=>{subs[x.key]=0})});
return{playerName:“Aventurière”,cfg:DSTATS,stats,subStats:subs,
tasks:[
{id:uid(),title:“Réviser 20 min”,sk:“s1”,sub:“ss1”,diff:“easy”,timer:25,deadline:null,done:false,at:null},
{id:uid(),title:“Préparer un repas”,sk:“s2”,sub:“ss4”,diff:“medium”,timer:null,deadline:null,done:false,at:null},
{id:uid(),title:“10 min de yoga”,sk:“s3”,sub:“ss7”,diff:“easy”,timer:10,deadline:null,done:false,at:null},
],
done:[],nextColor:0};
}

const KEY=“rpg-v4”;
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):buildInit()}catch{return buildInit()}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}

/* ═══ PETITS COMPOSANTS ═══ */

function ProgressBar({cur,max,color,h=10}){
return <div style={{background:T.bg,border:`1px solid ${T.border}`,height:h,borderRadius:2}}>
<div style={{width:`${Math.min((cur/max)*100,100)}%`,height:“100%”,borderRadius:2,
background:`linear-gradient(90deg,${color}55,${color})`,boxShadow:`0 0 8px ${color}66`,transition:“width .6s”}}/>

  </div>;
}

function Badge({deadline}){
const d=daysLeft(deadline);
const col=d<0?T.red:d<=3?T.peach:T.lav;
const lbl=d<0?“En retard !”:d===0?“Aujourd’hui !”:d===1?“Demain”:`${d} jours`;
return <span style={{fontFamily:”‘Press Start 2P’”,fontSize:6,color:col,
border:`1px solid ${col}`,padding:“2px 6px”,marginLeft:6}}>📅 {lbl}</span>;
}

function Toast({events,onClose}){
useEffect(()=>{const t=setTimeout(onClose,4000);return()=>clearTimeout(t)},[]);
return <div style={{position:“fixed”,top:20,left:“50%”,transform:“translateX(-50%)”,
background:T.panel2,border:`2px solid ${T.accent}`,boxShadow:`0 0 40px ${T.accent}55`,
padding:“16px 28px”,zIndex:9999,textAlign:“center”,minWidth:240}}>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:10,color:T.accent,marginBottom:8}}>✨ LEVEL UP !</div>
{events.map((e,i)=><div key={i} style={{fontFamily:“VT323”,fontSize:22,color:T.text}}>{e.icon} {e.label} → Niv.{e.level}</div>)}

  </div>;
}

/* ═══ TASK CARD ═══ */
function TaskCard({task,cfg,onAction,onDel,isObj}){
const [tl,setTl]=useState(null);
useEffect(()=>{
if(!task.at||!task.timer)return;
const end=task.at+task.timer*60000;
const tick=()=>setTl(Math.max(0,end-Date.now()));
tick();const id=setInterval(tick,500);return()=>clearInterval(id);
},[task.at,task.timer]);

const fmt=ms=>{const s=Math.floor(ms/1000),m=Math.floor(s/60);return`${m}:${(s%60).toString().padStart(2,"0")}`};
const inTime=tl!==null&&tl>0;
const stat=cfg.find(s=>s.key===task.sk);
const sub=stat?.subs.find(x=>x.key===task.sub);
const xpB=XP_BASE[task.diff];
const bColor=task.done?T.border:inTime?T.green+“66”:stat?.color+“55”;

return <div style={{border:`1px solid ${bColor}`,background:task.done?”#120810”:T.panel,
padding:“12px 14px”,marginBottom:9,opacity:task.done?.5:1,position:“relative”,overflow:“hidden”,transition:“all .3s”}}>
{!task.done&&<div style={{position:“absolute”,left:0,top:0,bottom:0,width:3,
background:inTime?T.green:stat?.color,boxShadow:`0 0 8px ${inTime?T.green:stat?.color}`}}/>}
<div style={{display:“flex”,gap:10,alignItems:“flex-start”}}>
<button onClick={()=>!task.done&&onAction(task.id,“complete”)}
style={{width:22,height:22,flexShrink:0,marginTop:2,
border:`2px solid ${task.done?T.border:stat?.color}`,
background:task.done?T.border:“transparent”,cursor:task.done?“default”:“pointer”,
color:T.text,fontSize:12,display:“flex”,alignItems:“center”,justifyContent:“center”}}>
{task.done?“✓”:””}
</button>
<div style={{flex:1,minWidth:0}}>
<div style={{fontFamily:“VT323”,fontSize:20,color:task.done?T.muted:T.text,
textDecoration:task.done?“line-through”:“none”,marginBottom:5,display:“flex”,alignItems:“center”,flexWrap:“wrap”,gap:4}}>
{task.title}
{task.deadline&&!task.done&&<Badge deadline={task.deadline}/>}
</div>
<div style={{display:“flex”,flexWrap:“wrap”,gap:6,alignItems:“center”,marginBottom:task.timer&&!task.done?8:0}}>
{stat&&<span style={{fontFamily:”‘Press Start 2P’”,fontSize:6,color:stat.color}}>{stat.icon} {stat.label}</span>}
{sub&&<span style={{fontFamily:”‘Press Start 2P’”,fontSize:6,color:T.muted}}>› {sub.icon} {sub.label}</span>}
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:6,color:T.lav}}>+{xpB} XP{task.at&&inTime?` ⚡+${XP_BONUS}`:””}</span>
</div>
{task.timer&&!task.done&&(
task.at?
<div style={{display:“inline-flex”,alignItems:“center”,gap:6,padding:“4px 10px”,
border:`1px solid ${inTime?T.green+"44":T.red+"44"}`,background:inTime?T.green+“11”:T.red+“11”}}>
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:8,color:inTime?T.green:T.red}}>
{tl!==null?(inTime?`⏱ ${fmt(tl)}`:“⌛ Temps écoulé”):”…”}
</span>
</div>:
<button onClick={()=>onAction(task.id,“start”)} style={{fontFamily:”‘Press Start 2P’”,fontSize:6,
background:T.lav+“22”,border:`1px solid ${T.lav}`,color:T.lav,padding:“5px 10px”,cursor:“pointer”}}>
▶ Démarrer {task.timer}min (+{XP_BONUS} XP bonus)
</button>
)}
</div>
<button onClick={()=>onDel(task.id)} style={{background:“none”,border:“none”,color:T.muted,cursor:“pointer”,fontSize:14,flexShrink:0}}>✕</button>
</div>

  </div>;
}

/* ═══ FORMULAIRE AJOUT QUÊTE ═══ */
function AddTaskForm({cfg,onAdd,onClose,isObj}){
const[f,setF]=useState({title:””,sk:cfg[0]?.key||””,sub:””,diff:“easy”,timer:””,deadline:””});
const subs=cfg.find(s=>s.key===f.sk)?.subs||[];
return <div style={{border:`1px solid ${T.glow}`,background:T.panel2,padding:16,marginTop:12}}>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:7,color:T.accent,marginBottom:14}}>✦ {isObj?“NOUVEL OBJECTIF”:“NOUVELLE QUÊTE”}</div>
<input placeholder=“Titre…” value={f.title} onChange={e=>setF(p=>({…p,title:e.target.value}))}
onKeyDown={e=>e.key===“Enter”&&f.title.trim()&&onAdd(f)}
style={{…inp,marginBottom:8}}/>
<div style={{display:“grid”,gridTemplateColumns:“1fr 1fr”,gap:8,marginBottom:8}}>
<select value={f.sk} onChange={e=>{setF(p=>({…p,sk:e.target.value,sub:””}))}} style={inp}>
{cfg.map(s=><option key={s.key} value={s.key}>{s.icon} {s.label}</option>)}
</select>
<select value={f.sub} onChange={e=>setF(p=>({…p,sub:e.target.value}))} style={inp}>
<option value="">— Sous-comp.</option>
{subs.map(x=><option key={x.key} value={x.key}>{x.icon} {x.label}</option>)}
</select>
</div>
<div style={{display:“grid”,gridTemplateColumns:“1fr 1fr 1fr”,gap:8,marginBottom:12}}>
<select value={f.diff} onChange={e=>setF(p=>({…p,diff:e.target.value}))} style={inp}>
<option value="easy">+15 — Facile</option>
<option value="medium">+30 — Moyen</option>
<option value="hard">+50 — Difficile</option>
</select>
<input type=“number” placeholder=“⏱ min” value={f.timer}
onChange={e=>setF(p=>({…p,timer:e.target.value}))} style={inp}/>
<input type=“date” value={f.deadline}
onChange={e=>setF(p=>({…p,deadline:e.target.value}))} style={{…inp,colorScheme:“dark”}}/>
</div>
<div style={{display:“flex”,gap:8}}>
<button onClick={()=>f.title.trim()&&onAdd(f)} style={{flex:1,background:T.accent,border:“none”,
color:T.bg,padding:“10px”,fontFamily:”‘Press Start 2P’”,fontSize:7,cursor:“pointer”}}>AJOUTER ✦</button>
<button onClick={onClose} style={{background:“none”,border:`1px solid ${T.border}`,
color:T.muted,padding:“10px 14px”,fontFamily:”‘Press Start 2P’”,fontSize:7,cursor:“pointer”}}>✕</button>
</div>

  </div>;
}

/* ═══ ONGLET STATS ═══ */
function StatsTab({cfg,stats,subStats}){
const[open,setOpen]=useState({});
const total=cfg.reduce((a,s)=>a+mkXp(stats[s.key]||0).level,0);
return <div>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:7,color:T.accent,marginBottom:16}}>FICHE DE PERSONNAGE</div>
<div style={{background:`linear-gradient(135deg,${T.panel},${T.panel2})`,border:`1px solid ${T.accent}33`,
padding:16,marginBottom:20,display:“flex”,gap:14,alignItems:“center”,boxShadow:`0 0 24px ${T.accent}22`}}>
<div style={{fontSize:48}}>🧸</div>
<div>
<div style={{fontFamily:“VT323”,fontSize:26,color:T.text,marginBottom:4}}>Niveau total</div>
<div style={{fontFamily:“VT323”,fontSize:48,color:T.gold,lineHeight:1}}>{total}</div>
</div>
</div>
{cfg.map(s=>{
const{level,cur,max}=mkXp(stats[s.key]||0);
return <div key={s.key} style={{marginBottom:10}}>
<div onClick={()=>setOpen(p=>({…p,[s.key]:!p[s.key]}))}
style={{background:open[s.key]?T.panel2:T.panel,border:`1px solid ${open[s.key]?s.color+"77":s.color+"33"}`,
padding:“11px 14px”,cursor:“pointer”,boxShadow:open[s.key]?`0 0 14px ${s.color}22`:“none”}}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:7}}>
<span style={{fontFamily:“VT323”,fontSize:22,color:s.color}}>{s.icon}  {s.label}</span>
<div style={{display:“flex”,alignItems:“center”,gap:10}}>
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:8,color:s.color}}>Niv.{level}</span>
<span style={{color:T.muted,fontSize:12}}>{open[s.key]?“▲”:“▼”}</span>
</div>
</div>
<ProgressBar cur={cur} max={max} color={s.color}/>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:6,color:T.muted,marginTop:4,textAlign:“right”}}>{cur}/{max} XP</div>
</div>
{open[s.key]&&<div style={{marginLeft:16,borderLeft:`2px solid ${s.color}44`,paddingLeft:12,paddingTop:6}}>
{s.subs.map(x=>{
const xi=mkXp(subStats[x.key]||0);
return <div key={x.key} style={{background:T.panel2,border:`1px solid ${T.border}33`,
padding:“9px 12px”,marginBottom:6}}>
<div style={{display:“flex”,justifyContent:“space-between”,marginBottom:5}}>
<span style={{fontFamily:“VT323”,fontSize:18,color:T.text}}>{x.icon} {x.label}</span>
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:7,color:T.muted}}>Niv.{xi.level}</span>
</div>
<ProgressBar cur={xi.cur} max={xi.max} color={s.color} h={7}/>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:6,color:T.muted,marginTop:3,textAlign:“right”}}>{xi.cur}/{xi.max} XP</div>
</div>;
})}
</div>}
</div>;

    return{...prev,tasks:prev.tasks.map(t=>t.id===id?{...t,at:Date.now()}:t)};

    }

      const sub=prev.cfg.flatMap(s=>s.subs).find(x=>x.key===task.sub);
      ups.push({icon:sub?.icon,label:sub?.label,level:mkXp(nSubs[task.sub]).level});
    }
  }
  if(ups.length>0)setToast(ups);

  return{...prev,stats:nStats,subStats:nSubs,

    done:[...prev.done,{...task,completedAt:Date.now(),xp:xpGain,bonus:inTime}]};
});
