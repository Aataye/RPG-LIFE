<script type="text/babel">

var useState = React.useState;

// ═══ COULEURS ═══

var COLORS = ["#ffaed6","#ffb3e6","#ffd6f0","#c9a8ff","#fda4af","#f9a8d4","#b8a2ff","#fbcfe8","#fecdd3","#f5d0fe","#99f6e4","#86efac"];
var EMOJIS = ["📚","🎓","🧠","✏️","🍳","🥗","🍰","☕","💪","🏃","🧘","⚽","💌","👯","🏠","❤️","🎀","🎨","🎵","✍️","🌸","🌙","🛁","😴","⭐","🦋","💎","🔥","🌈","🎯","🧩","🎮"];
var MOTIVS = ["Tu es capable de tout ! 💕","Chaque petit pas compte ✨","Tu brilles déjà 🌟","La régularité bat le talent 🎀","Fière de toi avant même de commencer 🌸","Ton futur toi te remercie 💖","T'es incroyable 🦋","Une quête à la fois, princesse ⭐"];

var XP_E = 15, XP_M = 30, XP_H = 50, XP_BONUS = 20, XP_MAX = 100;

// ═══ HELPERS ═══
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function daysLeft(d) { return Math.ceil((new Date(d) - new Date()) / 86400000); }
function getXp(diff) { return diff === "hard" ? XP_H : diff === "medium" ? XP_M : XP_E; }
function mkLvl(xp) { return { level: Math.floor(xp / XP_MAX) + 1, cur: xp % XP_MAX, max: XP_MAX }; }

function getSub(cfg, subKey) { for (var i = 0; i < cfg.length; i++) { for (var j = 0; j < cfg[i].subs.length; j++) { if (cfg[i].subs[j].key === subKey) return cfg[i].subs[j]; } } return null; }

];

function buildInit() {

    ],

  };
}

var SAVE_KEY = "rpg-life-v6";

    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return buildInit();
}

}

// ═══ COMPOSANTS SIMPLES ═══

function ProgressBar(props) {
  var cur = props.cur, max = props.max, color = props.color, h = props.h || 10;
  var pct = max > 0 ? Math.min((cur / max) * 100, 100) : 0;
  return (
    <div className="progress-wrap" style={{ height: h }}>
      <div className="progress-fill" style={{ width: pct + "%", background: "linear-gradient(90deg," + color + "55," + color + ")", boxShadow: "0 0 8px " + color + "66" }}/>
    </div>

}

function DeadlineBadge(props) {
  var d = daysLeft(props.deadline);
  var col = d < 0 ? C.RED : d <= 3 ? C.PEACH : C.LAV;
  var lbl = d < 0 ? "En retard !" : d === 0 ? "Auj. !" : d === 1 ? "Demain" : d + " jours";
  return <span className="badge" style={{ color: col, borderColor: col }}>📅 {lbl}</span>;
}

function LevelUpToast(props) {
  useEffect(function() {
    var t = setTimeout(props.onClose, 4000);

      })}

  );
}

function TimerBtn(props) {
  var task = props.task, onAction = props.onAction;
  var tl = props.tl;
  var inTime = tl !== null && tl > 0;
  function fmt(ms) {
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    var ss = s % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  }
  if (!task.timer || task.done) return null;
  if (task.at) {
    return (
      <div style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "4px 10px", border: "1px solid " + (inTime ? C.GREEN + "44" : C.RED + "44"), background: inTime ? C.GREEN + "11" : C.RED + "11" }}>
        <span className="ps" style={{ fontSize: 8, color: inTime ? C.GREEN : C.RED }}>
          {tl !== null ? (inTime ? "⏱ " + fmt(tl) : "⌛ Temps écoulé") : "..."}
        </span>
      </div>
    );
  }
  return (
    <button onClick={function() { onAction(task.id, "start"); }} style={{ fontFamily: "'Press Start 2P'", fontSize: 6, background: C.LAV + "22", border: "1px solid " + C.LAV, color: C.LAV, padding: "5px 10px" }}>
      ▶ Démarrer {task.timer}min (+{XP_BONUS} XP bonus)
    </button>
  );
}

function TaskCard(props) {
  var task = props.task, cfg = props.cfg, onAction = props.onAction, onDel = props.onDel;
  var tl2 = useState(null);
  var tl = tl2[0], setTl = tl2[1];

  useEffect(function() {
    if (!task.at || !task.timer) return;
    var end = task.at + task.timer * 60000;
    function tick() { setTl(Math.max(0, end - Date.now())); }
    tick();
    var id = setInterval(tick, 500);
    return function() { clearInterval(id); };
  }, [task.at, task.timer]);

  var inTime = tl !== null && tl > 0;
  var stat = getStat(cfg, task.sk);
  var sub = task.sub ? getSub(cfg, task.sub) : null;
  var xpBase = getXp(task.diff);
  var sc = stat ? stat.color : C.ACCENT;
  var borderCol = task.done ? C.BORDER : (inTime ? C.GREEN + "66" : sc + "55");

  return (
    <div className={"task-card" + (task.done ? " done" : "")} style={{ borderColor: borderCol }}>
      {!task.done && <div className="task-strip" style={{ background: inTime ? C.GREEN : sc, boxShadow: "0 0 8px " + (inTime ? C.GREEN : sc) }}/>}
      <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
        <button
          onClick={function() { if (!task.done) onAction(task.id, "complete"); }}
          style={{ width: 22, height: 22, flexShrink: 0, marginTop: 2, border: "2px solid " + (task.done ? C.BORDER : sc), background: task.done ? C.BORDER : "transparent", color: C.TEXT, fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center", cursor: task.done ? "default" : "pointer" }}>
          {task.done ? "✓" : ""}
        </button>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="vt" style={{ fontSize: 20, color: task.done ? C.MUTED : C.TEXT, textDecoration: task.done ? "line-through" : "none", marginBottom: 5, display: "flex", flexWrap: "wrap", alignItems: "center", gap: 4 }}>
            {task.title}
            {task.deadline && !task.done && <DeadlineBadge deadline={task.deadline}/>}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", marginBottom: task.timer && !task.done ? 8 : 0 }}>
            {stat && <span className="ps" style={{ fontSize: 6, color: sc }}>{stat.icon} {stat.label}</span>}
            {sub && <span className="ps" style={{ fontSize: 6, color: C.MUTED }}>› {sub.icon} {sub.label}</span>}
            <span className="ps" style={{ fontSize: 6, color: C.LAV }}>+{xpBase} XP{task.at && inTime ? " ⚡+" + XP_BONUS : ""}</span>
          </div>
          <TimerBtn task={task} onAction={onAction} tl={tl}/>

      </div>
    </div>
  );
}

function AddForm(props) {
  var cfg = props.cfg, onAdd = props.onAdd, onClose = props.onClose;
  var firstSk = cfg.length > 0 ? cfg[0].key : "";
  var s2 = useState({ title: "", sk: firstSk, sub: "", diff: "easy", timer: "", deadline: "" });
  var f = s2[0], setF = s2[1];
  var currentStat = getStat(cfg, f.sk);

  function set(k, v) { setF(function(p) { var n = {}; for (var x in p) n[x] = p[x]; n[k] = v; return n; }); }

  return (
    <div className="form-box">
      <div className="ps" style={{ fontSize: 7, color: C.ACCENT, marginBottom: 14 }}>✦ NOUVELLE QUÊTE</div>

        <input className="inp" type="date" value={f.deadline} onChange={function(e) { set("deadline", e.target.value); }}/>

// ═══ ONGLET QUÊTES ═══
function QuetesTab(props) {
  var tasks = props.tasks, cfg = props.cfg, onAction = props.onAction, onDel = props.onDel, onAdd = props.onAdd;
  var s2 = useState(false); var showAdd = s2[0], setShowAdd = s2[1];

          </div>}

// ═══ ONGLET OBJECTIFS ═══
function ObjectifsTab(props) {
  var tasks = props.tasks, cfg = props.cfg, onAction = props.onAction, onDel = props.onDel, onAdd = props.onAdd;
  var objs = tasks.filter(function(t) { return !!t.deadline; });
  var sorted = objs.slice().sort(function(a, b) { return new Date(a.deadline) - new Date(b.deadline); });
  var upcoming = sorted.filter(function(t) { return !t.done; });
  var done = sorted.filter(function(t) { return t.done; });
  return (
    <div>
      <div className="section-title">OBJECTIFS & DEADLINES</div>

// ═══ ONGLET STATS ═══
function StatsTab(props) {
  var cfg = props.cfg, stats = props.stats, subStats = props.subStats;
  var s2 = useState({}); var open = s2[0], setOpen = s2[1];
  var total = cfg.reduce(function(a, s) { return a + mkLvl(stats[s.key] || 0).level; }, 0);
  function toggle(key) { setOpen(function(p) { var n = {}; for (var k in p) n[k] = p[k]; n[key] = !n[key]; return n; }); }
  return (
    <div>
      <div className="section-title">FICHE DE PERSONNAGE</div>
      <div style={{ background: "linear-gradient(135deg," + C.PANEL + "," + C.PANEL2 + ")", border: "1px solid " + C.ACCENT + "33", padding: 16, marginBottom: 20, display: "flex", gap: 14, alignItems: "center", boxShadow: "0 0 24px " + C.ACCENT + "22" }}>

        </div>
      </div>
      {cfg.map(function(s) {
        var li = mkLvl(stats[s.key] || 0);
        var isO = !!open[s.key];
        return (
          <div key={s.key} className="stat-bar-wrap">
            <div onClick={function() { toggle(s.key); }} style={{ background: isO ? C.PANEL2 : C.PANEL, border: "1px solid " + (isO ? s.color + "77" : s.color + "33"), padding: "11px 14px", cursor: "pointer", boxShadow: isO ? "0 0 14px " + s.color + "22" : "none" }}>
              <div className="stat-header">

                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span className="ps" style={{ fontSize: 8, color: s.color }}>Niv.{li.level}</span>
                  <span style={{ color: C.MUTED, fontSize: 12 }}>{isO ? "▲" : "▼"}</span>

              <div className="text-muted" style={{ marginTop: 4, textAlign: "right" }}>{li.cur}/{li.max} XP</div>

                {s.subs.map(function(x) {
                  var xi = mkLvl(subStats[x.key] || 0);
                  return (
                    <div key={x.key} className="sub-card">
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                        <span className="vt" style={{ fontSize: 18, color: C.TEXT }}>{x.icon} {x.label}</span>
                        <span className="ps" style={{ fontSize: 7, color: C.MUTED }}>Niv.{xi.level}</span>
                      </div>
                      <ProgressBar cur={xi.cur} max={xi.max} color={s.color} h={7}/>
                      <div className="text-muted" style={{ marginTop: 3, textAlign: "right" }}>{xi.cur}/{xi.max} XP</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function IconModal(props) {
  var modal = props.modal, onPick = props.onPick, onClose = props.onClose;
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" onClick={function(e) { e.stopPropagation(); }}>

function ConfigTab(props) {
  var cfg = props.cfg, onSave = props.onSave;
  var s2 = useState(function() { return JSON.parse(JSON.stringify(cfg)); });
  var c = s2[0], setC = s2[1];
  var s3 = useState(null); var openStat = s3[0], setOpenStat = s3[1];
  var s4 = useState(null); var iconModal = s4[0], setIconModal = s4[1];

  function updStat(sk, field, val) {
    setC(function(p) { return p.map(function(s) { return s.key === sk ? Object.assign({}, s, { [field]: val }) : s; }); });
  }
  function rmStat(sk) { setC(function(p) { return p.filter(function(s) { return s.key !== sk; }); }); }
  function addStat() {
    var key = "s" + uid();
    setC(function(p) { return p.concat([{ key: key, label: "Nouvelle stat", icon: "⭐", color: COLORS[0], subs: [] }]); });
  }
  function updSub(sk, subKey, field, val) {
    setC(function(p) {
      return p.map(function(s) {
        if (s.key !== sk) return s;
        return Object.assign({}, s, { subs: s.subs.map(function(x) { return x.key === subKey ? Object.assign({}, x, { [field]: val }) : x; }) });
      });
    });
  }
  function rmSub(sk, subKey) {
    setC(function(p) {
      return p.map(function(s) {
        if (s.key !== sk) return s;
        return Object.assign({}, s, { subs: s.subs.filter(function(x) { return x.key !== subKey; }) });
      });
    });
  }
  function addSub(sk) {
    var key = "ss" + uid();
    setC(function(p) {
      return p.map(function(s) {
        if (s.key !== sk) return s;
        return Object.assign({}, s, { subs: s.subs.concat([{ key: key, label: "Sous-comp.", icon: "✦" }]) });
      });
    });
  }
  function pickIcon(val) {
    if (!iconModal) return;
    if (iconModal.type === "stat") updStat(iconModal.sk, "icon", val);
    else updSub(iconModal.sk, iconModal.subKey, "icon", val);
    setIconModal(null);
  }

  return (
    <div>
      <div className="section-title">PERSONNALISATION</div>
      <div className="vt" style={{ fontSize: 17, color: C.MUTED, marginBottom: 16 }}>Modifie tes stats librement. Clique pour déplier.</div>

      {c.map(function(s) {
        var isO = openStat === s.key;
        return (
          <div key={s.key} style={{ marginBottom: 10, border: "1px solid " + s.color + "44", background: C.PANEL }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", background: isO ? C.PANEL2 : C.PANEL, cursor: "pointer" }} onClick={function() { setOpenStat(function(p) { return p === s.key ? null : s.key; }); }}>
              <div onClick={function(e) { e.stopPropagation(); setIconModal({ type: "stat", sk: s.key }); }}
                style={{ width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, border: "1px solid " + C.BORDER, background: C.BG, cursor: "pointer", flexShrink: 0 }}>
                {s.icon}
              </div>
              <input className="inp" value={s.label} onClick={function(e) { e.stopPropagation(); }}
                onChange={function(e) { updStat(s.key, "label", e.target.value); }}
                style={{ flex: 1, fontSize: 18 }}/>
              <div onClick={function(e) { e.stopPropagation(); }} style={{ display: "flex", flexWrap: "wrap", gap: 3, maxWidth: 108 }}>
                {COLORS.map(function(col) {
                  return <div key={col} className="color-dot" onClick={function() { updStat(s.key, "color", col); }}
                    style={{ background: col, border: s.color === col ? "2px solid #fff" : "1px solid transparent" }}/>;
                })}
              </div>
              <button onClick={function(e) { e.stopPropagation(); rmStat(s.key); }} style={{ background: "none", border: "none", color: C.RED, fontSize: 16, flexShrink: 0 }}>✕</button>
              <span style={{ color: C.MUTED, fontSize: 12, flexShrink: 0 }}>{isO ? "▲" : "▼"}</span>
            </div>

            {isO && (
              <div style={{ padding: "8px 12px 12px", borderTop: "1px solid " + C.BORDER }}>
                <div className="text-muted" style={{ marginBottom: 10 }}>SOUS-COMPÉTENCES</div>
                {s.subs.map(function(x) {
                  return (
                    <div key={x.key} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 7 }}>
                      <div onClick={function() { setIconModal({ type: "sub", sk: s.key, subKey: x.key }); }}
                        style={{ width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17, border: "1px solid " + C.BORDER, background: C.BG, cursor: "pointer", flexShrink: 0 }}>
                        {x.icon}
                      </div>
                      <input className="inp" value={x.label} onChange={function(e) { updSub(s.key, x.key, "label", e.target.value); }} style={{ flex: 1, fontSize: 17 }}/>
                      <button onClick={function() { rmSub(s.key, x.key); }} style={{ background: "none", border: "none", color: C.RED, fontSize: 14, flexShrink: 0 }}>✕</button>
                    </div>
                  );
                })}
                <button onClick={function() { addSub(s.key); }} className="btn-ghost" style={{ marginTop: 4, fontSize: 6, color: C.LAV, borderColor: C.GLOW }}>+ Ajouter sous-compétence</button>
              </div>
            )}
          </div>
        );
      })}

      <button className="btn-ghost" onClick={addStat} style={{ marginBottom: 12 }}>+ AJOUTER UNE STAT</button>
      <button className="btn-pink" onClick={function() { onSave(c); }}>SAUVEGARDER ✦</button>

      {iconModal && <IconModal modal={iconModal} onPick={pickIcon} onClose={function() { setIconModal(null); }}/>}
    </div>
  );
}

// ═══ APP PRINCIPALE ═══
function App() {
  var s2 = useState(loadState); var st = s2[0], setSt = s2[1];
  var s3 = useState("quetes"); var tab = s3[0], setTab = s3[1];
  var s4 = useState(null); var toast = s4[0], setToast = s4[1];
  var s5 = useState(false); var editName = s5[0], setEditName = s5[1];
  var s6 = useState(""); var nameInput = s6[0], setNameInput = s6[1];
  var motiv = useState(function() { return MOTIVS[Math.floor(Math.random() * MOTIVS.length)]; })[0];

  useEffect(function() { saveState(st); }, [st]);

  function handleTask(id, type) {
    setSt(function(prev) {
      if (type === "resetAll") {
        return Object.assign({}, prev, { tasks: prev.tasks.map(function(t) { return Object.assign({}, t, { done: false, at: null }); }) });
      }
      var task = null;
      for (var i = 0; i < prev.tasks.length; i++) { if (prev.tasks[i].id === id) { task = prev.tasks[i]; break; } }
      if (!task) return prev;

      if (type === "start" && task.timer && !task.at && !task.done) {
        return Object.assign({}, prev, { tasks: prev.tasks.map(function(t) { return t.id === id ? Object.assign({}, t, { at: Date.now() }) : t; }) });
      }
      if (type !== "complete" || task.done) return prev;

      var xpBase = getXp(task.diff);
      var inTime = task.at && task.timer ? (task.at + task.timer * 60000 > Date.now()) : false;
      var xpGain = xpBase + (inTime ? XP_BONUS : 0);

      var nStats = Object.assign({}, prev.stats);
      var nSubs = Object.assign({}, prev.subStats);
      var ups = [];

      if (nStats[task.sk] !== undefined) {
        var oldP = nStats[task.sk] || 0;
        nStats[task.sk] = oldP + xpGain;
        if (mkLvl(nStats[task.sk]).level > mkLvl(oldP).level) {
          var sc = getStat(prev.cfg, task.sk);
          if (sc) ups.push({ icon: sc.icon, label: sc.label, level: mkLvl(nStats[task.sk]).level });
        }
      }
      if (task.sub && nSubs[task.sub] !== undefined) {
        var oldS = nSubs[task.sub] || 0;
        nSubs[task.sub] = oldS + xpGain;
        if (mkLvl(nSubs[task.sub]).level > mkLvl(oldS).level) {
          var sub = getSub(prev.cfg, task.sub);
          if (sub) ups.push({ icon: sub.icon, label: sub.label, level: mkLvl(nSubs[task.sub]).level });
        }
      }
      if (ups.length > 0) setToast(ups);

      return Object.assign({}, prev, {
        stats: nStats,
        subStats: nSubs,
        tasks: prev.tasks.map(function(t) { return t.id === id ? Object.assign({}, t, { done: true }) : t; }),
        done: prev.done.concat([Object.assign({}, task, { completedAt: Date.now(), xp: xpGain, bonus: inTime })])
      });
    });
  }

  function delTask(id) { setSt(function(p) { return Object.assign({}, p, { tasks: p.tasks.filter(function(t) { return t.id !== id; }) }); }); }

  function addTask(f) {
    var timer = f.timer ? parseInt(f.timer) : null;
    setSt(function(p) {
      return Object.assign({}, p, {
        tasks: p.tasks.concat([{ id: uid(), title: f.title, sk: f.sk, sub: f.sub || null, diff: f.diff, timer: timer, deadline: f.deadline || null, done: false, at: null }])
      });
    });
  }

  function saveCfg(newCfg) {
    setSt(function(prev) {
      var nStats = Object.assign({}, prev.stats);
      var nSubs = Object.assign({}, prev.subStats);
      newCfg.forEach(function(s) {
        if (nStats[s.key] === undefined) nStats[s.key] = 0;
        s.subs.forEach(function(x) { if (nSubs[x.key] === undefined) nSubs[x.key] = 0; });
      });
      return Object.assign({}, prev, { cfg: newCfg, stats: nStats, subStats: nSubs });
    });
    setTab("quetes");
  }

  var total = st.cfg.reduce(function(a, s) { return a + mkLvl(st.stats[s.key] || 0).level; }, 0);
  var TABS = [["quetes","⚔ Quêtes"],["objectifs","📅 Objectifs"],["stats","🌸 Stats"],["journal","📜 Journal"],["config","⚙ Config"]];

  return (
    <div style={{ background: C.BG, minHeight: "100vh", color: C.TEXT, paddingBottom: 60 }}>
      {toast && <LevelUpToast events={toast} onClose={function() { setToast(null); }}/>}

      <div className="header">
        <div className="vt shimmer" style={{ fontSize: 16, color: C.LAV, textAlign: "center", marginBottom: 12 }}>✦ {motiv} ✦</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div className="float" style={{ fontSize: 44 }}>🧸</div>
            <div>
              <div className="ps" style={{ fontSize: 6, color: C.ACCENT, letterSpacing: 2, marginBottom: 5 }}>✦ LIFE RPG ✦</div>
              {editName
                ? <div style={{ display: "flex", gap: 6 }}>
                    <input className="inp" value={nameInput}
                      onChange={function(e) { setNameInput(e.target.value); }}
                      onKeyDown={function(e) { if (e.key === "Enter") { setSt(function(p) { return Object.assign({}, p, { playerName: nameInput || p.playerName }); }); setEditName(false); } }}
                      style={{ fontSize: 16, width: 130, padding: "4px 8px" }} autoFocus/>
                    <button onClick={function() { setSt(function(p) { return Object.assign({}, p, { playerName: nameInput || p.playerName }); }); setEditName(false); }}
                      style={{ background: C.ACCENT, border: "none", color: C.BG, padding: "4px 8px", fontFamily: "'Press Start 2P'", fontSize: 7 }}>OK</button>
                  </div>
                : <div className="vt" style={{ fontSize: 26, color: C.TEXT, cursor: "pointer" }} onClick={function() { setNameInput(st.playerName); setEditName(true); }}>
                    {st.playerName} <span style={{ fontSize: 14, color: C.MUTED }}>✎</span>
                  </div>}
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div className="ps" style={{ fontSize: 6, color: C.MUTED, marginBottom: 3 }}>NIV. TOTAL</div>
            <div className="vt" style={{ fontSize: 44, color: C.GOLD, lineHeight: 1 }}>{total}</div>
          </div>
        </div>
      </div>

      <div className="tab-bar">
        {TABS.map(function(item) {
          var k = item[0], l = item[1];
          return <button key={k} className={"tab-btn" + (tab === k ? " active" : "")} onClick={function() { setTab(k); }}>{l}</button>;
        })}
      </div>

      <div className="content">
        {tab === "quetes"    && <QuetesTab tasks={st.tasks} cfg={st.cfg} onAction={handleTask} onDel={delTask} onAdd={addTask}/>}
        {tab === "objectifs" && <ObjectifsTab tasks={st.tasks} cfg={st.cfg} onAction={handleTask} onDel={delTask} onAdd={addTask}/>}
        {tab === "stats"     && <StatsTab cfg={st.cfg} stats={st.stats} subStats={st.subStats}/>}
        {tab === "journal"   && <JournalTab done={st.done} cfg={st.cfg}/>}
        {tab === "config"    && <ConfigTab cfg={st.cfg} onSave={saveCfg}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
