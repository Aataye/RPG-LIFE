<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🌸 Mon RPG de Vie</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#150d1e}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#7b2d5e;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useCallback} = React;

// ═══ THÈME ═══
const BG=”#150d1e”, PANEL=”#1f1030”, PANEL2=”#2a1540”;
const BORDER=”#4a2060”, GLOW=”#7a3090”;
const TEXT=”#ffe4f0”, MUTED=”#9b6aaa”;
const ACCENT=”#ffaed6”, LAV=”#c9a8ff”, PEACH=”#ffb3a0”;
const GOLD=”#ffd580”, GREEN=”#98f5c0”, RED=”#ff8fa0”;

const COLORS=[”#ffaed6”,”#ffb3e6”,”#ffd6f0”,”#c9a8ff”,”#fda4af”,”#f9a8d4”,”#b8a2ff”,”#fbcfe8”,”#fecdd3”,”#f5d0fe”,”#99f6e4”,”#86efac”];
const EMOJIS=[“📚”,“🎓”,“🧠”,“✏️”,“🍳”,“🥗”,“🍰”,“☕”,“💪”,“🏃”,“🧘”,“⚽”,“💌”,“👯”,“🏠”,“❤️”,“🎀”,“🎨”,“🎵”,“✍️”,“🌸”,“🌙”,“🛁”,“😴”,“⭐”,“🦋”,“💎”,“🔥”,“🌈”,“🎯”,“🧩”,“🎮”];

const XP_EASY=15, XP_MED=30, XP_HARD=50, XP_BONUS=20, XP_MAX=100;
const MOTIVS=[“Tu es capable de tout ! 💕”,“Chaque petit pas compte ✨”,“Tu brilles déjà 🌟”,“La régularité bat le talent 🎀”,“Fière de toi 🌸”,“Ton futur toi te remercie 💖”,“T’es incroyable 🦋”,“Une quête à la fois, princesse ⭐”];

// ═══ STYLES RÉUTILISABLES ═══
const inpStyle = {
background: PANEL2, border: “1px solid “+BORDER, color: TEXT,
padding: “8px 10px”, fontFamily: “VT323”, fontSize: “18px”,
outline: “none”, width: “100%”
};
const btnPink = {
background: ACCENT, border: “none”, color: BG,
padding: “11px”, fontFamily: “‘Press Start 2P’”, fontSize: “7px”, cursor: “pointer”, width: “100%”
};
const btnGhost = {
background: “transparent”, border: “1px dashed “+GLOW, color: ACCENT,
padding: “13px”, fontFamily: “‘Press Start 2P’”, fontSize: “7px”, cursor: “pointer”, width: “100%”
};

// ═══ HELPERS ═══
function mkLvl(xp) {
return { level: Math.floor(xp/XP_MAX)+1, cur: xp%XP_MAX, max: XP_MAX };
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function daysLeft(d) { return Math.ceil((new Date(d) - new Date()) / 86400000); }
function getXpBase(diff) { return diff===“easy”?XP_EASY:diff===“medium”?XP_MED:XP_HARD; }

// ═══ DONNÉES PAR DÉFAUT ═══
const DEFAULT_CFG = [
{key:“s1”,label:“Intelligence”,icon:“📚”,color:”#f9a8d4”,subs:[{key:“ss1”,label:“Cours”,icon:“🖊️”},{key:“ss2”,label:“Langues”,icon:“💬”},{key:“ss3”,label:“Culture G.”,icon:“🌍”}]},
{key:“s2”,label:“Cuisine”,icon:“🍳”,color:”#fda4af”,subs:[{key:“ss4”,label:“Plats”,icon:“🍜”},{key:“ss5”,label:“Pâtisserie”,icon:“🍰”}]},
{key:“s3”,label:“Sport”,icon:“💪”,color:”#c9a8ff”,subs:[{key:“ss6”,label:“Cardio”,icon:“🏃”},{key:“ss7”,label:“Yoga”,icon:“🧘”},{key:“ss8”,label:“Muscu”,icon:“🏋️”}]},
{key:“s4”,label:“Social”,icon:“💌”,color:”#fbcfe8”,subs:[{key:“ss9”,label:“Amis”,icon:“👯”},{key:“ss10”,label:“Famille”,icon:“🏠”}]},
{key:“s5”,label:“Créativité”,icon:“🎀”,color:”#f5d0fe”,subs:[{key:“ss11”,label:“Dessin”,icon:“🎨”},{key:“ss12”,label:“Musique”,icon:“🎵”},{key:“ss13”,label:“Écriture”,icon:“✍️”}]},
{key:“s6”,label:“Bien-être”,icon:“🌸”,color:”#fecdd3”,subs:[{key:“ss14”,label:“Méditation”,icon:“🌙”},{key:“ss15”,label:“Soins”,icon:“🛁”},{key:“ss16”,label:“Sommeil”,icon:“😴”}]},
];

function buildStats(cfg) {
const stats={}, subs={};
cfg.forEach(function(s){ stats[s.key]=0; s.subs.forEach(function(x){subs[x.key]=0;}); });
return {stats, subs};
}

function buildInit() {
const {stats,subs} = buildStats(DEFAULT_CFG);
return {
playerName: “Aventurière”,
cfg: DEFAULT_CFG,
stats: stats,
subStats: subs,
tasks: [
{id:uid(),title:“Réviser 20 min”,sk:“s1”,sub:“ss1”,diff:“easy”,timer:25,deadline:null,done:false,at:null},
{id:uid(),title:“Préparer un repas”,sk:“s2”,sub:“ss4”,diff:“medium”,timer:null,deadline:null,done:false,at:null},
{id:uid(),title:“10 min de yoga”,sk:“s3”,sub:“ss7”,diff:“easy”,timer:10,deadline:null,done:false,at:null},
],
done: [],
};
}

const SAVE_KEY = “rpg-v5”;
function loadState() {
try { var r=localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : buildInit(); }
catch(e) { return buildInit(); }
}
function saveState(s) {
try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch(e) {}
}

// ═══ COMPOSANTS UI ═══

function Bar({cur, max, color, h}) {
var h2 = h || 10;
var pct = Math.min((cur/max)*100, 100);
return (
<div style={{background:BG, border:“1px solid “+BORDER, height:h2, borderRadius:2}}>
<div style={{width:pct+”%”, height:“100%”, borderRadius:2,
background:“linear-gradient(90deg,”+color+“55,”+color+”)”,
boxShadow:“0 0 8px “+color+“66”, transition:“width .6s”}}/>
</div>
);
}

function DeadlineBadge({deadline}) {
var d = daysLeft(deadline);
var col = d<0 ? RED : d<=3 ? PEACH : LAV;
var lbl = d<0 ? “En retard !” : d===0 ? “Auj. !” : d===1 ? “Demain” : d+” jours”;
return (
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,color:col,
border:“1px solid “+col,padding:“2px 5px”,marginLeft:6,whiteSpace:“nowrap”}}>
📅 {lbl}
</span>
);
}

function LevelUpToast({events, onClose}) {
useEffect(function(){ var t=setTimeout(onClose,4000); return function(){clearTimeout(t);}; }, []);
return (
<div style={{position:“fixed”,top:20,left:“50%”,transform:“translateX(-50%)”,
background:PANEL2,border:“2px solid “+ACCENT,boxShadow:“0 0 40px “+ACCENT+“55”,
padding:“16px 28px”,zIndex:9999,textAlign:“center”,minWidth:240}}>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:“10px”,color:ACCENT,marginBottom:8}}>✨ LEVEL UP !</div>
{events.map(function(e,i){
return <div key={i} style={{fontFamily:“VT323”,fontSize:“22px”,color:TEXT}}>{e.icon} {e.label} → Niv.{e.level}</div>;
})}
</div>
);
}

function TaskCard({task, cfg, onAction, onDel}) {
var [tl, setTl] = useState(null);

useEffect(function(){
if(!task.at || !task.timer) return;
var end = task.at + task.timer*60000;
function tick(){ setTl(Math.max(0, end-Date.now())); }
tick();
var id = setInterval(tick, 500);
return function(){ clearInterval(id); };
}, [task.at, task.timer]);

function fmt(ms){ var s=Math.floor(ms/1000),m=Math.floor(s/60); return m+”:”+(s%60).toString().padStart(2,“0”); }
var inTime = tl!==null && tl>0;
var stat = cfg.find(function(s){return s.key===task.sk;});
var sub = stat ? stat.subs.find(function(x){return x.key===task.sub;}) : null;
var xpBase = getXpBase(task.diff);
var sColor = stat ? stat.color : ACCENT;

return (
<div style={{border:“1px solid “+(task.done?BORDER:inTime?GREEN+“66”:sColor+“55”),
background:task.done?”#120810”:PANEL, padding:“12px 14px”, marginBottom:9,
opacity:task.done?0.5:1, position:“relative”, overflow:“hidden”}}>
{!task.done &&
<div style={{position:“absolute”,left:0,top:0,bottom:0,width:3,
background:inTime?GREEN:sColor, boxShadow:“0 0 8px “+(inTime?GREEN:sColor)}}/>}
<div style={{display:“flex”, gap:10, alignItems:“flex-start”}}>
<button onClick={function(){!task.done && onAction(task.id,“complete”);}}
style={{width:22,height:22,flexShrink:0,marginTop:2,
border:“2px solid “+(task.done?BORDER:sColor),
background:task.done?BORDER:“transparent”,
cursor:task.done?“default”:“pointer”,
color:TEXT,fontSize:“12px”,display:“flex”,alignItems:“center”,justifyContent:“center”}}>
{task.done ? “✓” : “”}
</button>
<div style={{flex:1,minWidth:0}}>
<div style={{fontFamily:“VT323”,fontSize:“20px”,color:task.done?MUTED:TEXT,
textDecoration:task.done?“line-through”:“none”,marginBottom:5,display:“flex”,flexWrap:“wrap”,alignItems:“center”,gap:4}}>
{task.title}
{task.deadline && !task.done && <DeadlineBadge deadline={task.deadline}/>}
</div>
<div style={{display:“flex”,flexWrap:“wrap”,gap:6,alignItems:“center”,marginBottom:task.timer&&!task.done?8:0}}>
{stat && <span style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,color:sColor}}>{stat.icon} {stat.label}</span>}
{sub && <span style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,color:MUTED}}>› {sub.icon} {sub.label}</span>}
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,color:LAV}}>
+{xpBase} XP{task.at&&inTime?” ⚡+”+XP_BONUS:””}
</span>
</div>
{task.timer && !task.done && (
task.at ?
<div style={{display:“inline-flex”,alignItems:“center”,gap:6,padding:“4px 10px”,
border:“1px solid “+(inTime?GREEN+“44”:RED+“44”),background:inTime?GREEN+“11”:RED+“11”}}>
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:“8px”,color:inTime?GREEN:RED}}>
{tl!==null ? (inTime ? “⏱ “+fmt(tl) : “⌛ Temps écoulé”) : “…”}
</span>
</div> :
<button onClick={function(){onAction(task.id,“start”);}}
style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,
background:LAV+“22”,border:“1px solid “+LAV,color:LAV,padding:“5px 10px”,cursor:“pointer”}}>
▶ Démarrer {task.timer}min (+{XP_BONUS} XP bonus)
</button>
)}
</div>
<button onClick={function(){onDel(task.id);}}
style={{background:“none”,border:“none”,color:MUTED,cursor:“pointer”,fontSize:“14px”,flexShrink:0}}>✕</button>
</div>
</div>
);
}

function AddForm({cfg, onAdd, onClose}) {
var firstSk = cfg.length>0 ? cfg[0].key : “”;
var [f, setF] = useState({title:””,sk:firstSk,sub:””,diff:“easy”,timer:””,deadline:””});
var currentSubs = (cfg.find(function(s){return s.key===f.sk;}) || {subs:[]}).subs;

return (
<div style={{border:“1px solid “+GLOW,background:PANEL2,padding:16,marginTop:12}}>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:“7px”,color:ACCENT,marginBottom:14}}>✦ NOUVELLE QUÊTE</div>
<input placeholder=“Titre de la quête…” value={f.title}
onChange={function(e){setF(function(p){return Object.assign({},p,{title:e.target.value});});}}
onKeyDown={function(e){if(e.key===“Enter”&&f.title.trim())onAdd(f);}}
style={Object.assign({},inpStyle,{marginBottom:8})}/>
<div style={{display:“grid”,gridTemplateColumns:“1fr 1fr”,gap:8,marginBottom:8}}>
<select value={f.sk} onChange={function(e){setF(function(p){return Object.assign({},p,{sk:e.target.value,sub:””});});}} style={inpStyle}>
{cfg.map(function(s){return <option key={s.key} value={s.key}>{s.icon} {s.label}</option>;})}
</select>
<select value={f.sub} onChange={function(e){setF(function(p){return Object.assign({},p,{sub:e.target.value});});}} style={inpStyle}>
<option value="">— Sous-comp.</option>
{currentSubs.map(function(x){return <option key={x.key} value={x.key}>{x.icon} {x.label}</option>;})}
</select>
</div>
<div style={{display:“grid”,gridTemplateColumns:“1fr 1fr 1fr”,gap:8,marginBottom:12}}>
<select value={f.diff} onChange={function(e){setF(function(p){return Object.assign({},p,{diff:e.target.value});});}} style={inpStyle}>
<option value="easy">+15 — Facile</option>
<option value="medium">+30 — Moyen</option>
<option value="hard">+50 — Difficile</option>
</select>
<input type=“number” placeholder={“⏱ min (+”+XP_BONUS+” XP)”} value={f.timer}
onChange={function(e){setF(function(p){return Object.assign({},p,{timer:e.target.value});});}}
style={inpStyle}/>
<input type=“date” value={f.deadline}
onChange={function(e){setF(function(p){return Object.assign({},p,{deadline:e.target.value});});}}
style={Object.assign({},inpStyle,{colorScheme:“dark”})}/>
</div>
<div style={{display:“flex”,gap:8}}>
<button onClick={function(){if(f.title.trim())onAdd(f);}} style={btnPink}>AJOUTER ✦</button>
<button onClick={onClose} style={{background:“none”,border:“1px solid “+BORDER,
color:MUTED,padding:“11px 14px”,fontFamily:”‘Press Start 2P’”,fontSize:“7px”,cursor:“pointer”}}>✕</button>
</div>
</div>
);
}

// ═══ ONGLET QUÊTES ═══
function QuetesTab({tasks, cfg, onAction, onDel, onAdd}) {
var [showAdd, setShowAdd] = useState(false);
var quetes = tasks.filter(function(t){return !t.deadline;});
var nbDone = quetes.filter(function(t){return t.done;}).length;

return (
<div>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:6}}>
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:“7px”,color:ACCENT}}>QUÊTES DU JOUR</span>
<span style={{fontFamily:“VT323”,fontSize:“18px”,color:MUTED}}>{nbDone}/{quetes.length}</span>
</div>
<Bar cur={nbDone} max={Math.max(quetes.length,1)} color={ACCENT} h={8}/>
<div style={{marginBottom:16}}/>

```
  {quetes.length===0 &&
    <div style={{textAlign:"center",padding:48,color:MUTED,fontFamily:"VT323",fontSize:"20px"}}>
      Aucune quête active 🌸<br/>Ajoute ta première mission !
    </div>}

  {quetes.map(function(t){return <TaskCard key={t.id} task={t} cfg={cfg} onAction={onAction} onDel={onDel}/>;})}

  {showAdd
    ? <AddForm cfg={cfg} onAdd={function(f){onAdd(f);setShowAdd(false);}} onClose={function(){setShowAdd(false);}}/>
    : <div style={{display:"flex",gap:8,marginTop:10}}>
        <button onClick={function(){setShowAdd(true);}} style={btnGhost}>✦ NOUVELLE QUÊTE</button>
        {nbDone>0 &&
          <button onClick={function(){onAction(null,"resetAll");}}
            style={{border:"1px solid "+BORDER,background:"none",color:MUTED,
              padding:"13px",fontFamily:"'Press Start 2P'",fontSize:"7px",cursor:"pointer"}}>↺</button>}
      </div>}
</div>
```

);
}

// ═══ ONGLET OBJECTIFS ═══
function ObjectifsTab({tasks, cfg, onAction, onDel, onAdd}) {
var [showAdd, setShowAdd] = useState(false);
var objs = tasks.filter(function(t){return !!t.deadline;});
var sorted = objs.slice().sort(function(a,b){return new Date(a.deadline)-new Date(b.deadline);});
var upcoming = sorted.filter(function(t){return !t.done;});
var done = sorted.filter(function(t){return t.done;});

return (
<div>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:“7px”,color:ACCENT,marginBottom:8}}>OBJECTIFS & DEADLINES</div>
<div style={{fontFamily:“VT323”,fontSize:“17px”,color:MUTED,marginBottom:16}}>
Quêtes avec date limite, triées par urgence.
</div>

```
  {upcoming.length===0 &&
    <div style={{textAlign:"center",padding:36,color:MUTED,fontFamily:"VT323",fontSize:"20px"}}>
      Aucun objectif en cours 🌸<br/>Ajoute une quête avec une deadline !
    </div>}

  {upcoming.map(function(t){return <TaskCard key={t.id} task={t} cfg={cfg} onAction={onAction} onDel={onDel}/>;})}

  {done.length>0 && <>
    <div style={{fontFamily:"'Press Start 2P'",fontSize:"6px",color:MUTED,margin:"16px 0 10px"}}>ACCOMPLIS ✓</div>
    {done.map(function(t){return <TaskCard key={t.id} task={t} cfg={cfg} onAction={onAction} onDel={onDel}/>;})}
  </>}

  {showAdd
    ? <AddForm cfg={cfg} onAdd={function(f){onAdd(f);setShowAdd(false);}} onClose={function(){setShowAdd(false);}}/>
    : <button onClick={function(){setShowAdd(true);}} style={Object.assign({},btnGhost,{marginTop:12})}>✦ NOUVEL OBJECTIF</button>}
</div>
```

);
}

// ═══ ONGLET STATS ═══
function StatsTab({cfg, stats, subStats}) {
var [open, setOpen] = useState({});
var total = cfg.reduce(function(a,s){return a+mkLvl(stats[s.key]||0).level;}, 0);

return (
<div>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:“7px”,color:ACCENT,marginBottom:16}}>FICHE DE PERSONNAGE</div>
<div style={{background:“linear-gradient(135deg,”+PANEL+”,”+PANEL2+”)”,border:“1px solid “+ACCENT+“33”,
padding:16,marginBottom:20,display:“flex”,gap:14,alignItems:“center”,boxShadow:“0 0 24px “+ACCENT+“22”}}>
<div style={{fontSize:“48px”}}>🧸</div>
<div>
<div style={{fontFamily:“VT323”,fontSize:“20px”,color:MUTED,marginBottom:2}}>Niveau total</div>
<div style={{fontFamily:“VT323”,fontSize:“52px”,color:GOLD,lineHeight:1}}>{total}</div>
</div>
</div>

```
  {cfg.map(function(s){
    var lvInfo = mkLvl(stats[s.key]||0);
    var isOpen = !!open[s.key];
    return (
      <div key={s.key} style={{marginBottom:10}}>

          style={{background:isOpen?PANEL2:PANEL,border:"1px solid "+(isOpen?s.color+"77":s.color+"33"),
            padding:"11px 14px",cursor:"pointer",boxShadow:isOpen?"0 0 14px "+s.color+"22":"none"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
            <span style={{fontFamily:"VT323",fontSize:"22px",color:s.color}}>{s.icon}  {s.label}</span>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontFamily:"'Press Start 2P'",fontSize:"8px",color:s.color}}>Niv.{lvInfo.level}</span>
              <span style={{color:MUTED,fontSize:"12px"}}>{isOpen?"▲":"▼"}</span>
            </div>
          </div>
          <Bar cur={lvInfo.cur} max={lvInfo.max} color={s.color}/>

        </div>

          <div style={{marginLeft:16,borderLeft:"2px solid "+s.color+"44",paddingLeft:12,paddingTop:6}}>

              var xi = mkLvl(subStats[x.key]||0);
              return (
                <div key={x.key} style={{background:PANEL2,border:"1px solid "+BORDER+"33",padding:"9px 12px",marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                    <span style={{fontFamily:"VT323",fontSize:"18px",color:TEXT}}>{x.icon} {x.label}</span>

                </div>
              );
            })}
          </div>}
      </div>
    );
  })}
</div>

);
}

// ═══ ONGLET JOURNAL ═══
function JournalTab({done, cfg}) {
return (
<div>
<div style={{fontFamily:”‘Press Start 2P’”,fontSize:“7px”,color:ACCENT,marginBottom:16}}>JOURNAL D’AVENTURE</div>
{done.length===0
? <div style={{textAlign:“center”,padding:48,color:MUTED,fontFamily:“VT323”,fontSize:“20px”}}>
Aucune quête accomplie.<br/>C’est ici que commence ta légende 🌸
</div>
: done.slice().reverse().map(function(t,i){
var s = cfg.find(function(x){return x.key===t.sk;});
var sub = s ? s.subs.find(function(x){return x.key===t.sub;}) : null;
var d = new Date(t.completedAt);
return (
<div key={i} style={{border:“1px solid “+BORDER,padding:“10px 14px”,marginBottom:8,
background:PANEL,display:“flex”,justifyContent:“space-between”,alignItems:“center”}}>
<div>
<div style={{fontFamily:“VT323”,fontSize:“19px”,color:MUTED,marginBottom:3}}>✓ {t.title}</div>
<div style={{display:“flex”,gap:8,flexWrap:“wrap”,alignItems:“center”}}>
{s && <span style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,color:s.color}}>{s.icon} {s.label}</span>}
{sub && <span style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,color:MUTED}}>› {sub.icon} {sub.label}</span>}
<span style={{fontFamily:”‘Press Start 2P’”,fontSize:“6px”,color:LAV}}>+{t.xp} XP{t.bonus?” ⚡”:””}</span>
</div>

useEffect(function(){ saveState(st); }, [st]);

var handleTask = useCallback(function(id, type) {
setSt(function(prev) {
if(type===“resetAll”) {
return Object.assign({},prev,{tasks:prev.tasks.map(function(t){return Object.assign({},t,{done:false,at:null});})});
}
var task = prev.tasks.find(function(t){return t.id===id;});
if(!task) return prev;

```
  if(type==="start" && task.timer && !task.at && !task.done) {
    return Object.assign({},prev,{tasks:prev.tasks.map(function(t){return t.id===id?Object.assign({},t,{at:Date.now()}):t;})});
  }
  if(type!=="complete" || task.done) return prev;

  var xpBase = getXpBase(task.diff);
  var inTime = task.at && task.timer ? task.at+task.timer*60000>Date.now() : false;
  var xpGain = xpBase + (inTime ? XP_BONUS : 0);

  var nStats = Object.assign({},prev.stats);
  var nSubs = Object.assign({},prev.subStats);
  var ups = [];

  if(nStats[task.sk]!==undefined) {
    var oldP = nStats[task.sk]||0;
    nStats[task.sk] = oldP+xpGain;
    if(mkLvl(nStats[task.sk]).level > mkLvl(oldP).level) {
      var sc = prev.cfg.find(function(x){return x.key===task.sk;});
      if(sc) ups.push({icon:sc.icon,label:sc.label,level:mkLvl(nStats[task.sk]).level});
    }
  }
  if(task.sub && nSubs[task.sub]!==undefined) {
    var oldS = nSubs[task.sub]||0;
    nSubs[task.sub] = oldS+xpGain;
    if(mkLvl(nSubs[task.sub]).level > mkLvl(oldS).level) {
      var subFound = null;
      prev.cfg.forEach(function(s){var f=s.subs.find(function(x){return x.key===task.sub;}); if(f)subFound=f;});
      if(subFound) ups.push({icon:subFound.icon,label:subFound.label,level:mkLvl(nSubs[task.sub]).level});
    }
  }
  if(ups.length>0) setToast(ups);

  return Object.assign({},prev,{
    stats:nStats, subStats:nSubs,
    tasks:prev.tasks.map(function(t){return t.id===id?Object.assign({},t,{done:true}):t;}),
    done:prev.done.concat([Object.assign({},task,{completedAt:Date.now(),xp:xpGain,bonus:inTime})]),
  });
});
